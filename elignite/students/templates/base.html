{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{{ global_settings.site_name|default:'ELIGNITE' }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
  <header class="topbar">
    <div class="container nav-wrap">
      <a href="{% url 'home' %}" class="brand">{{ global_settings.site_name|default:'ELIGNITE' }}</a>
      <nav>
        <a href="{% url 'program_list' %}">Programs</a>
        <a href="{% url 'services' %}">Services</a>
        <a href="{% url 'about' %}">About</a>
        <a href="{% url 'enroll' %}">Enroll</a>
      </nav>
    </div>
  </header>

  <main class="container main-block">{% block content %}{% endblock %}</main>
  <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
